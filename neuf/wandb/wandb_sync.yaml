# PII-2146 / PII-2420: the series the W&B model dashboard shows, and the one gate on what
# reaches it. One entry per arm; neuf/wandb/schema.yaml in the pii repo is the key set. A
# series is one or more store scores POOLED per threshold (sync.py's pool_curves), and its
# name is the key on the run, plot/eval/<name>/. Only real arms belong here (the arms of
# runs/models.csv); a test arm syncs into a throwaway project with `--project` instead
# (PII-2193).
#
# PII-2558: gt_bench_sparse is nobody's series any more and is listed under no arm. armBB34
# went with it: it had no other score, and sync.py refuses an entry whose series list is
# empty. Dropping a series does not delete what is already on a run; PII-2558 deletes the
# plot/eval/gt_bench_sparse/* summary keys separately.

# PII-2641: `fpv_extra` and `wrist_extra` are EXTRA-ONLY series, the same members as `fpv` and
# `wrist` pooled again under a second name, writing only [score, recall,
# extra_fp_per_frame] -- PII-2620's FP/frame beyond the teacher. W&B history is append-only, so
# that column cannot be added to the fpv and wrist rows already pushed; the four "FP/frame
# beyond teacher" panels of the eval-curves view plot these keys instead. score and recall come
# along as the panels' two x axes. Their `_score_hash` marker is per series, so an extra push
# leaves fpv and wrist exactly as they are, and the append-only guard refuses a second one.

# PII-2383, the FPV distillation pair: drafted with the arms, pushed only when
# `chain.py <arm> wandb_sync` runs. Untagged, as armBD34/armBE34 were (PII-2061), so the
# "eval curves" view takes them. The four dashboard sections of PII-2420 are fpv (faceight_b
# + faceight_c pooled) and wrist (facedub_a), each by score and by recall; faceback_45 is no
# longer pushed or plotted.
- arm: armBI34
  tags: []
  series:
    - name: fpv
      members:
        - dataset: faceight_b
          version: v3
        - dataset: faceight_c
          version: v3
    - name: wrist
      members:
        - dataset: facedub_a
          version: v1
    - name: fpv_extra
      keys: [score, recall, extra_fp_per_frame]
      members:
        - dataset: faceight_b
          version: v3
        - dataset: faceight_c
          version: v3
    - name: wrist_extra
      keys: [score, recall, extra_fp_per_frame]
      members:
        - dataset: facedub_a
          version: v1
- arm: armBJ34
  tags: []
  series:
    - name: fpv
      members:
        - dataset: faceight_b
          version: v3
        - dataset: faceight_c
          version: v3
    - name: wrist
      members:
        - dataset: facedub_a
          version: v1
    - name: fpv_extra
      keys: [score, recall, extra_fp_per_frame]
      members:
        - dataset: faceight_b
          version: v3
        - dataset: faceight_c
          version: v3
    - name: wrist_extra
      keys: [score, recall, extra_fp_per_frame]
      members:
        - dataset: facedub_a
          version: v1

