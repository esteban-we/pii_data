# PII-2729: armBS on facedub_a boxes/v1, IoU 0.2 (score.py's constant, PII-2181).
# min_side 17.6: 40 is what every stored eval used; facedub_a is scored at 17.6, the floor
# PII-2041 reported that set at.
predictions: runs/armBS/inference/facedub_a/predictions.csv
split: eval
boxes_version: v1
min_side: 17.6
# PII-2448: Recognizable Recall against boxes/rec1, at this file's own min_side.
rec_boxes_version: rec1

# PII-2620: Extra FP per frame against a SECOND GT, armAP's dump at 0.4 -- the
# /model-eval GT-row rule (PII-2520 / PII-2529) at gti 0.2. curves.csv gains
# extra_fp_per_frame_iou0.2, the dets at or above the threshold that match no GT2
# box at IoU 0.2, per eval frame.
extra_gt:
  predictions: runs/armAP/inference/facedub_a/predictions.csv
  thr: 0.4
