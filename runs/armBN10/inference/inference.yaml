# why PII-2545: armBN10's inference on FLUENCE, the host that trained it, so the ONNX the
# train step wrote is already here and there is no hop to gpu-002 (PII-2478, PII-2484).
# Every key is armBN34's fluence inference.yaml's but `arm` and `checkpoint`.
# gpus: [0] is a COUNT of 1 on a slurm host: chain.py asks --gres=gpu:1 and slurm picks the
# device.
