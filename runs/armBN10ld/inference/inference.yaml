checkpoint: runs/armBN10ld/train/onnx/armBN10ld.onnx
datasets: [gt_bench_sparse, faceback_45, faceight_b, faceight_c, facedub_a]
split: eval
det_size: 1024
pad: true
host: fluence1
gpus: [0]

