notes: |
  train_Z5 with ONE change: the faceight_b and faceight_c blocks read boxes v3, the second
  review pass of those two rounds (WOR-1425 drop of 2026-09-22, datasets/faceight_{b,c}/boxes/v3).
  Every other block is train_Z5's, byte for byte, and the frame set is identical: v3 replaces
  boxes on frames, never frames. The legacy manifest train_Z6.txt was built by
  training/mk_mix_Z6.py, which merged the same drop into train_Z5.txt; this view reproduces it
  (PII-1681). The DINOv2 arms armAL..armAU trained on it.
  Block counts: faceight_b 48,073 frames / 49,726 boxes (train_Z5: 51,894 boxes),
  faceight_c 32,120 / 27,046 (train_Z5: 22,582). Total 303,407 frames / 394,229 boxes.
  face10k drops its 16 `unlabeled` frames, which have no v1 label and no row in v1 boxes.csv;
  that is the `where` filter, and it is why the block has 11,491 of the dataset's 11,507 frames.
