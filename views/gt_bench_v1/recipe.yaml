# Rendered by data/build_view.py (PII-1373). Image paths are absolute into
# /data/esteban/pii2/datasets/<dataset>/images/; boxes come from
# /data/esteban/pii2/datasets/<dataset>/boxes/<boxes>/boxes.csv.
name: gt_bench_v1
role: eval
sources:
  - dataset: gt_bench_full
    boxes: v1
    split: eval
    min_side: 40
legacy:
  note: no legacy manifest or flat view directory; see notes
notes: |
  The full ground-truth bench, 9,636 frames, what eval_onnx.py --set full scores. The legacy
  views/eval/gt_bench_v1 was a directory link to the whole staged gt_bench_v1 dataset, which
  held two encodes of the same frames (images_full and images_sparse); pii2 splits them into
  gt_bench_full and gt_bench_sparse, so the legacy view maps to two pii2 views, this one and
  gt_bench_sparse_v1. There is no legacy manifest to reproduce. Frames are the eval side of
  the dataset's split.csv, sorted by image name. d2.json carries the 40 px long side floor the
  legacy egoblur eval exports used (PII-1406): a box under it is written iscrowd=1, an ignore
  region, exactly as evaluation/egoblur_d2/d2_dataset.py did. scrfd.txt is unaffected by the
  floor, since mmdet applies its own at train time.
