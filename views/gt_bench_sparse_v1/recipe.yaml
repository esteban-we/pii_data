notes: |
  The 889 frame sparse slice of the bench (the previous owner's encode), what eval_onnx.py
  --set sparse scores and what most historical recall figures used. The other half of the
  legacy views/eval/gt_bench_v1 link; see gt_bench_v1. Frames are the eval side of the
  dataset's split.csv, sorted by image name. d2.json carries the 40 px long side floor the
  legacy egoblur eval exports used (PII-1406): a box under it is written iscrowd=1, an ignore
  region, exactly as evaluation/egoblur_d2/d2_dataset.py did. scrfd.txt is unaffected by the
  floor, since mmdet applies its own at train time.
